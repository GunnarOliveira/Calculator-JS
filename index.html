<!DOCTYPE html>
<html>

<head lang="en">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <title>Calculator</title>
</head>

<body class="theme-01">
  <div>
    <button id="theme-01">THEME 01</button>
    <button id="theme-02">THEME 02</button>
  </div>
  <div class="calculator">
    <p>JOHN 3:16 </p>
    <input type="text" disabled id="display" value="00">
    <div class="box-buttons">
      <button onclick="clearDisplay()" class="clear">C</button>
      <button onclick="backspace()">&lt;</button>
      <button onclick="insertToDisplay('/')">/</button>
      <button onclick="insertToDisplay('*')">*</button>
      <button onclick="insertToDisplay('7')">7</button>
      <button onclick="insertToDisplay('8')">8</button>
      <button onclick="insertToDisplay('9')">9</button>
      <button onclick="insertToDisplay('-')">-</button>
      <button onclick="insertToDisplay('4')">4</button>
      <button onclick="insertToDisplay('5')">5</button>
      <button onclick="insertToDisplay('6')">6</button>
      <button onclick="insertToDisplay('+')">+</button>
      <button onclick="insertToDisplay('1')">1</button>
      <button onclick="insertToDisplay('2')">2</button>
      <button onclick="insertToDisplay('3')">3</button>
      <button onclick="insertToDisplay('0')" class="btn-zero">0</button>
      <button onclick="insertToDisplay('.')">.</button>
      <button onclick="result()" class="btn-result">=</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
